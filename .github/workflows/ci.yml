name: CI

# The quarantine of Feature 2 (the advice portal) and the extract fail-closed guards are enforced
# ONLY by tests — app/api/advice/route.test.ts, app/advice/quarantine.test.tsx and friends are what
# make a silent re-enable fail loudly. Until this workflow existed that enforcement depended on a
# human remembering to run vitest locally, which is not a control. Keep this green.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  research-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/ml/requirements-core.lock
      - run: python -m pip install --no-deps -e research
      - run: python -m unittest discover -s research/ml/tests -v
      - run: ht-tibetan validate research/contracts/fixtures/synthetic-dataset.json

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test research/ml/tests_web/*.test.mjs
      # --pool=threads: the default forks pool is flaky under CI/machine load in this project.
      - run: npx vitest run --pool=threads
      - run: npx tsc --noEmit
      - run: npm run build

  research-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: research/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
