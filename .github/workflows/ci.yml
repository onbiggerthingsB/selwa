name: CI

# The quarantine of Feature 2 (the advice portal) and the extract fail-closed guards are enforced
# ONLY by tests — app/api/advice/route.test.ts, app/advice/quarantine.test.tsx and friends are what
# make a silent re-enable fail loudly. Until this workflow existed that enforcement depended on a
# human remembering to run vitest locally, which is not a control. Keep this green.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --pool=threads: the default forks pool is flaky under CI/machine load in this project.
      - run: npx vitest run --pool=threads
      - run: npx tsc --noEmit
      - run: npm run build
